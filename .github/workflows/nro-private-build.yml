name: NRO PRIVATE Windows Build

on:
  push:
    branches: [nro-private-final]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout NRO Private source
        uses: actions/checkout@v4

      - name: Download untouched known-good Windows Mono player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/EHVNArchive/Dragonboy-CommunityMod-Builds/releases/download/latest/Build-StandaloneWindows-Mono2x.zip'
          Invoke-WebRequest -Uri $url -OutFile base.zip -UseBasicParsing
          Expand-Archive -Path base.zip -DestinationPath base -Force
          $asm = Get-ChildItem base -Recurse -Filter Assembly-CSharp.dll | Select-Object -First 1
          if (-not $asm) { throw 'Assembly-CSharp.dll not found in base build' }
          $exe = Get-ChildItem base -Recurse -File -Filter 'DragonBoy CommunityMod.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Stable Unity player executable not found' }
          "BASE_ASSEMBLY=$($asm.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MANAGED_DIR=$($asm.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PLAYER_ROOT=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GAME_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile standalone NRO Private addon against exact player assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $csc = Join-Path $vs 'MSBuild\Current\Bin\Roslyn\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe not found: $csc" }
          "CSC=$csc" | Out-File -FilePath $env:GITHUB_ENV -Append

          New-Item -ItemType Directory -Path patched -Force | Out-Null
          $rsp = New-Object System.Collections.Generic.List[string]
          $rsp.Add('/nologo')
          $rsp.Add('/target:library')
          $rsp.Add('/optimize+')
          $rsp.Add('/langversion:latest')
          $rsp.Add('/nostdlib+')
          $rsp.Add('/out:"' + (Join-Path $env:GITHUB_WORKSPACE 'patched\NROPrivateAddon.dll') + '"')
          Get-ChildItem $env:MANAGED_DIR -Filter *.dll | ForEach-Object { $rsp.Add('/reference:"' + $_.FullName + '"') }
          $rsp.Add('"' + (Join-Path $env:GITHUB_WORKSPACE 'NROPrivateBuild\NROPrivateAddon.cs') + '"')
          [IO.File]::WriteAllLines((Join-Path $env:GITHUB_WORKSPACE 'addon.rsp'), $rsp)
          & $csc '@addon.rsp'
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'patched\NROPrivateAddon.dll')) { throw 'Addon compile failed' }

      - name: Patch one safe call into original Assembly-CSharp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget install Mono.Cecil -Version 0.11.6 -OutputDirectory packages -NonInteractive | Out-Host
          $cecil = Get-ChildItem packages -Recurse -Filter Mono.Cecil.dll | Where-Object { $_.FullName -match 'net40' } | Select-Object -First 1
          if (-not $cecil) { throw 'Mono.Cecil.dll not found' }
          & $env:CSC /nologo /target:exe /optimize+ /out:patched\CecilPatcher.exe /reference:"$($cecil.FullName)" NROPrivateBuild\CecilPatcher.cs
          if ($LASTEXITCODE -ne 0) { throw 'Cecil patcher compile failed' }
          Copy-Item $cecil.FullName patched\Mono.Cecil.dll -Force
          & patched\CecilPatcher.exe $env:BASE_ASSEMBLY patched\NROPrivateAddon.dll $env:MANAGED_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Assembly patch failed' }
          Copy-Item patched\NROPrivateAddon.dll (Join-Path $env:MANAGED_DIR 'NROPrivateAddon.dll') -Force

      - name: Compile NRO_PRIVATE launcher without renaming Unity player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:CSC /nologo /target:winexe /optimize+ /out:patched\NRO_PRIVATE.exe /reference:System.Windows.Forms.dll NROPrivateBuild\Launcher.cs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'patched\NRO_PRIVATE.exe')) { throw 'Launcher compile failed' }
          Copy-Item patched\NRO_PRIVATE.exe (Join-Path $env:PLAYER_ROOT 'NRO_PRIVATE.exe') -Force

      - name: Static security checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ours = Get-ChildItem NROPrivateBuild -Recurse -Filter *.cs
          $blocked = @('GetAsyncKeyState','SetWindowsHookEx','WH_KEYBOARD','CreateRemoteThread','WriteProcessMemory','VirtualAllocEx','discord.com/api/webhooks','api.telegram.org')
          foreach ($p in $blocked) {
            $m = $ours | Select-String -SimpleMatch $p
            if ($m) { $m | ForEach-Object { Write-Host $_ }; throw "Blocked signature found: $p" }
          }
          $binaryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Join-Path $env:MANAGED_DIR 'NROPrivateAddon.dll')))
          foreach ($p in $blocked) { if ($binaryText.Contains($p)) { throw "Blocked binary signature found: $p" } }

      - name: Runtime smoke test on Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'smoke-player.log'
          $p = Start-Process -FilePath $env:GAME_EXE -ArgumentList '-logFile', $log -WorkingDirectory $env:PLAYER_ROOT -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            if (Test-Path $log) { Get-Content $log -Tail 250 | Out-Host }
            throw "Game exited during smoke test with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          if (Test-Path $log) {
            $fatal = Select-String -Path $log -Pattern 'NullReferenceException|MissingMethodException|TypeLoadException|FileNotFoundException|DllNotFoundException|Crash!!!|Aborting batchmode' -SimpleMatch:$false
            if ($fatal) { $fatal | ForEach-Object { Write-Host $_ }; throw 'Runtime smoke log contains fatal managed error' }
            Get-Content $log -Tail 80 | Out-Host
          }

      - name: Package runnable client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'NRO_PRIVATE_FINAL_V2'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item (Join-Path $env:PLAYER_ROOT '*') $out -Recurse -Force
          Set-Content -Path (Join-Path $out 'README.txt') -Value "NRO PRIVATE V2`r`nChạy NRO_PRIVATE.exe.`r`nUnity player gốc được giữ nguyên để tránh màn hình đen.`r`nMenu MOD nằm trong game." -Encoding UTF8
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath NRO_PRIVATE_FINAL_V2.zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash NRO_PRIVATE_FINAL_V2.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path NRO_PRIVATE_FINAL_V2.sha256 -Value "$hash  NRO_PRIVATE_FINAL_V2.zip" -Encoding ASCII

      - name: Upload NRO PRIVATE FINAL V2
        uses: actions/upload-artifact@v4
        with:
          name: NRO_PRIVATE_FINAL_V2
          path: |
            NRO_PRIVATE_FINAL_V2.zip
            NRO_PRIVATE_FINAL_V2.sha256
            smoke-player.log
          if-no-files-found: error
          retention-days: 7
